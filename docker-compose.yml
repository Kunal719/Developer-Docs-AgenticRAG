services:
  postgres:
    image: postgres:17
    container_name: developer_docs_rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password2
      POSTGRES_DB: developer_docs_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: